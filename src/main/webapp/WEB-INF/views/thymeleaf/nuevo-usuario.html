<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BondiWay - Registro</title>

    <link rel="icon" th:href="@{/imagenes/logo.png}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/nuevo-usuario.css}">

</head>
<body>
<div class="background-overlay"></div>
<div class="background-blur background-top"></div>
<div class="background-blur background-bottom"></div>
<main class="register-page">
    <section class="register-card">
        <div class="logo-container">
            <i class="fa-solid fa-route logo-icon"></i>
            <span class="logo-text">
                BondiWay
            </span>
        </div>
        <div class="register-header">
            <h1>Crear cuenta</h1>
            <p>
                Únete a BondiWay para gestionar
                tus viajes de manera inteligente. </p>
        </div>
        <form th:action="@{/registro}" method="POST" th:object="${datosRegistro}" class="register-form">
            <div class="two-columns">
                <div class="input-group input-simple">
                    <input th:field="*{nombre}" id="nombre" type="text" placeholder="Ingresa tu nombre" required>
                </div>
                <div class="input-group input-simple">
                    <input th:field="*{apellido}" id="apellido" type="text" placeholder="Ingresa tu apellido" required>
                </div>
            </div>
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i>
                    <input th:field="*{mail}" id="mail" type="email" placeholder="Ingresa tu email" required>
                </div>
            </div>
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input th:field="*{password}" id="password" type="password" placeholder="Ingresa tu password"
                           required>
                </div>
                <p class="helper-text">
                    Mínimo 8 caracteres. </p>
            </div>
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input th:field="*{repitePassword}" id="repitePassword" type="password"
                           placeholder="Repetir password" required>
                </div>
            </div>
            <!--<div class="checkbox-group">
                <input
                        id="terms"
                        type="checkbox"
                        required>
                <label for="terms">
                    Acepto los
                    <a href="#">
                        Términos de servicio
                    </a>
                    y la
                    <a href="#">
                        Política de privacidad
                    </a>
                    de BondiWay.
                </label>
            </div>-->
            <p th:if="${error != null}" class="error-message" th:text="'Error: ' + ${error}"></p>
            <button id="btn-registrarme" class="btn-primary" type="submit">
                <span>
                    Crear cuenta
                </span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
        <div class="section-divider">
            <p>
                ¿Ya tienes una cuenta?
                <a th:href="@{/login}">
                    Inicia sesión aquí
                </a>
            </p>
        </div>
    </section>
</main>
</body>
</html>
