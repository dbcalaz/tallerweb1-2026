<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>BondiWay - Ingresar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<div class="background-overlay"></div>
<div class="background-blur background-top"></div>
<div class="background-blur background-bottom"></div>

<main class="login-page">
    <section class="login-card">
        <div class="login-header">
            <div class="logo-container">
                <i class="fa-solid fa-route logo-icon"></i> <span class="logo-text">BondiWay</span>
            </div>
            <h1>Bienvenido a BondiWay</h1>
            <p>Inteligencia en movimiento</p>
        </div>
        <form th:action="@{/validar-login}" method="POST" th:object="${datosLogin}" class="login-form">
            <div class="input-group">
                <label for="email">Correo electrónico</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope"></i> <input th:field="*{email}" id="email" type="email"
                                                                  placeholder="ejemplo@bondiway.com" required>
                </div>
            </div>
            <div class="input-group">
                <label for="password">Contraseña</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i> <input th:field="*{password}" id="password" type="password"
                                                            placeholder="••••••••" required>
                </div>
            </div>
            <p th:if="${error != null}" class="error-message" th:text="'Error: ' + ${error}"></p>
            <button id="btn-login" class="btn-primary" type="submit">
                <span>Ingresar</span> <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
        <div class="login-footer">
            <p>
                ¿No tienes cuenta? <a th:href="@{/nuevo-usuario}"> Regístrate </a>
            </p>
        </div>
    </section>
</main>
<script type="module" th:src="@{/js/login.js}"></script>
</body>
</html>
