<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BondiWay - Mis Viajes en Curso</title>

    <link rel="icon" th:href="@{/imagenes/logo.png}" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/viaje-en-curso.css}">
</head>
<body style="background-color: var(--background);">

<div th:replace="componentes/nav-bar :: navbar('viajes')"></div>

<main class="container my-5" style="padding-top: 80px; padding-bottom: 100px;">
    <div class="row mb-4">
        <div class="col-12 text-center">
            <h2 class="fw-bold" style="color: var(--text-color);">Mis Viajes en Curso</h2>
        </div>
    </div>

    <div th:if="${sinViajes}" class="text-center mt-5">
        <p>No tienes viajes reservados actualmente.</p>
        <a th:href="@{/buscar-viaje}" class="btn btn-primary">Buscar Viajes</a>
    </div>

    <div th:unless="${sinViajes}" class="row justify-content-center">
        <div class="col-md-8" th:each="reserva : ${misReservas}">
            <div class="card mb-3 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title fw-bold">Viaje Programado</h5>

                    <p><strong>Origen:</strong> <span th:text="${reserva.viaje.origen}"></span></p>
                    <p><strong>Destino:</strong> <span th:text="${reserva.viaje.destino}"></span></p>
                    <p><strong>Fecha:</strong> <span th:text="${reserva.viaje.fecha}"></span></p>
                    <p><strong>Precio Total:</strong> $<span th:text="${reserva.precioTotal}"></span></p>

                    <h6 class="mt-3">Pasajeros confirmados:</h6>
                    <div class="list-group">
                        <div th:each="pasajero : ${reserva.pasajeros}" class="list-group-item d-flex justify-content-between align-items-center">
                            <div>
                                <span th:text="${pasajero.nombre + ' ' + pasajero.apellido}"></span>
                                <small class="text-muted ms-2" th:text="'DNI: ' + ${pasajero.dni}"></small>
                            </div>
                            <span class="badge bg-secondary rounded-pill px-3">
                                Asiento <span th:text="${pasajero.numeroAsiento}"></span>
                            </span>
                        </div>
                    </div>

                    <div class="text-end mt-2">
                        <form th:action="@{/cancelar-viaje}" method="POST" class="d-inline">
                            <input type="hidden" name="idViaje" th:value="${reserva.viaje.id}"/>
                            <button type="submit" class="btn btn-outline-danger fw-bold rounded-pill px-4" onclick="return confirm('¿Estás seguro de que querés cancelar este viaje?');">
                                <span class="material-symbols-outlined align-middle me-1" style="font-size: 18px;">cancel</span> Cancelar Reserva
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div style="position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000;">
    <div th:replace="componentes/footer :: footer"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
