<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle Viaje</title>

    <link rel="icon" th:href="@{/imagenes/logo.png}" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/perfilUsuario.css}">
</head>

<body>

<div th:replace="componentes/nav-bar :: navbar('home')"></div>

<main class="container py-5 d-flex justify-content-center">

    <div class="w-100" style="max-width: 850px;">

        <!-- HEADER VIAJE -->
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-3">

            <div>
                <span class="badge bg-primary mb-2" th:text="${viaje.tipoServicio}"></span>

                <h2 class="fw-bold mb-1">
                    <span th:text="${viaje.origen}"></span>
                    <span class="text-muted">→</span>
                    <span th:text="${viaje.destino}"></span>
                </h2>

                <div class="text-muted small">
                    <span th:text="${viaje.fecha}"></span>
                    ·
                    <span th:text="${viaje.horario}"></span>
                </div>
            </div>

            <div class="text-end">
                <div class="text-muted small">Precio por asiento</div>
                <div class="fs-3 fw-bold text-success">
                    $ <span th:text="${viaje.precio}"></span>
                </div>
            </div>

        </div>

        <hr class="my-4">

        <!-- INFO GRID -->
        <div class="row g-3">

            <div class="col-md-4">
                <div class="p-3 bg-light rounded text-center">
                    <div class="text-muted small">Asientos</div>
                    <div class="fs-5 fw-bold" th:text="${viaje.asientosDisponibles}"></div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="p-3 bg-light rounded text-center">
                    <div class="text-muted small">Duración</div>
                    <div class="fs-5 fw-bold" th:text="${viaje.duracion}"></div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="p-3 bg-light rounded text-center">
                    <div class="text-muted small">Estado</div>
                    <div class="fw-bold" th:text="${viaje.estadoDeViaje}"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- CONDUCTOR -->
    <div class="card border-0 shadow-sm p-4 mt-4" style="border-radius: 16px;">

        <h5 class="fw-bold mb-3">
            <span class="material-symbols-outlined align-middle">person</span>
            Conductor
        </h5>

        <div class="d-flex align-items-center gap-3">

            <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center text-white fw-bold"
                 style="width:50px;height:50px;">
                <span th:text="${conductor.nombre.substring(0,1)}"></span>
            </div>

            <div>
                <div class="fw-semibold">
                    <span th:text="${conductor.nombre}"></span>
                    <span th:text="${conductor.apellido}"></span>
                </div>
                <div class="text-muted small">Conductor verificado</div>
            </div>

            <div class="ms-auto text-end">
                <div class="text-muted small">Rating</div>
                <div class="fw-bold text-warning">⭐ 4.9</div>
            </div>

        </div>

    </div>

    <!-- ACCIONES -->
    <div class="d-flex gap-3 mt-4">

        <a th:href="@{/spring/misViajes}" class="btn btn-outline-secondary">
            ← Volver
        </a>

        <a href="#" class="btn btn-primary">
            Reservar asiento
        </a>

    </div>

</main>

<div th:replace="componentes/footer :: footer"></div>

</body>
</html>
