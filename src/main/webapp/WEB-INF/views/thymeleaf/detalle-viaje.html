<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle Viaje</title>

    <link rel="icon" th:href="@{/imagenes/logo.png}" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/perfilUsuario.css}">
    <link rel="stylesheet" th:href="@{/css/detalle-viaje.css}">
</head>

<body>

<div th:replace="componentes/nav-bar :: navbar('home')"></div>


<main class="detalle-container">

    <!-- HERO -->
    <div class="viaje-hero">

        <div class="viaje-hero-top">
            <div>
                <span class="badge-servicio" th:text="${viaje.tipoServicio}">Estándar</span>
                <h2 class="viaje-ruta">
                    <span th:text="${viaje.origen}">Origen</span>
                    <span class="arrow">→</span>
                    <span th:text="${viaje.destino}">Destino</span>
                </h2>
                <p class="viaje-fecha">
                    <span class="material-symbols-outlined" style="font-size:1rem;">calendar_month</span>
                    <span th:text="${viaje.fecha}">Fecha</span>
                    &nbsp;·&nbsp;
                    <span class="material-symbols-outlined" style="font-size:1rem;">schedule</span>
                    <span th:text="${viaje.horario}">Hora</span>
                </p>
            </div>

            <div class="precio-box">
                <div class="precio-label">Precio por asiento</div>
                <div class="precio-valor">$ <span th:text="${viaje.precio}">0</span></div>
            </div>
        </div>

        <div class="info-tiles">
            <div class="info-tile">
                <div class="tile-label">
                    <span class="material-symbols-outlined">event_seat</span>
                    Asientos libres
                </div>
                <div class="tile-value" th:text="${viaje.asientosDisponibles}">—</div>
            </div>

            <div class="info-tile">
                <div class="tile-label">
                    <span class="material-symbols-outlined">timer</span>
                    Duración
                </div>
                <div class="tile-value" th:text="${viaje.duracion}">—</div>
            </div>

            <div class="info-tile">
                <div class="tile-label">
                    <span class="material-symbols-outlined">info</span>
                    Estado
                </div>
                <div class="tile-value">
                    <span class="estado-pill"
                          th:classappend="'estado-' + ${viaje.estadoDeViaje}"
                          th:text="${viaje.estadoDeViaje}">
                    </span>
                </div>
            </div>
        </div>

    </div>

    <!-- CONDUCTOR -->
    <div class="conductor-card">
        <div class="conductor-card-label">
            <span class="material-symbols-outlined">badge</span>
            Conductor asignado
        </div>
        <div class="conductor-row">
            <div class="conductor-avatar">
                <span th:text="${conductor.nombre.substring(0,1)}">?</span>
            </div>
            <div>
                <div class="conductor-nombre">
                    <span th:text="${conductor.nombre}">Nombre</span>
                    <span th:text="${conductor.apellido}">Apellido</span>
                </div>
                <div class="conductor-sub">Conductor verificado · BondiWay</div>
            </div>
            <div class="conductor-rating">
                <div class="rating-label">Valoración</div>
                <div class="rating-value">⭐ 4.9</div>
            </div>
        </div>
    </div>

    <!-- ACCIONES -->
    <div class="acciones">
        <a th:href="@{/perfil-usuario}" class="btn-volver">
            <span class="material-symbols-outlined" style="font-size:1rem;">arrow_back</span>
            Volver
        </a>
        <a href="#" class="btn-reservar">
            <span class="material-symbols-outlined" style="font-size:1rem;">confirmation_number</span>
            Reservar asiento
        </a>
    </div>

</main>

<div th:replace="componentes/footer :: footer"></div>

</body>
</html>
