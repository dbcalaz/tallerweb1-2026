<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="admin-sidebar" th:fragment="sidebar-admin(activePage)">
    <div class="admin-brand">
        <div class="brand-logo-wrapper">
            <h2>BondiWay</h2>
            <span>Panel de Gestión</span>
        </div>
        <button type="button" class="sidebar-close-btn" id="mobile-sidebar-close">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <nav class="admin-nav">
        <a th:href="@{/viajes}" th:classappend="${activePage == 'viajes' ? ' active' : ''}"><span class="material-symbols-outlined">directions_bus</span> Viajes</a>
        <a th:href="@{/combis}" th:classappend="${activePage == 'combis' ? ' active' : ''}"><span class="material-symbols-outlined">directions_car</span> Combis</a>
        <a th:href="@{/conductores}" th:classappend="${activePage == 'conductores' ? ' active' : ''}"><span class="material-symbols-outlined">person_pin</span> Conductores</a>
    </nav>

    <div class="sidebar-footer-container">
        <div class="admin-user">
            <span class="material-symbols-outlined">account_circle</span>
            <div><strong>Admin Usuario</strong><small>Operaciones</small></div>
        </div>

        <a th:href="@{/logout}" class="btn-logout">
            <span class="material-symbols-outlined">logout</span>
            <span>Cerrar Sesión</span>
        </a>
    </div>
</aside>
</body>
</html>
