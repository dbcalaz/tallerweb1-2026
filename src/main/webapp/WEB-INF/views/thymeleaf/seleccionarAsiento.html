<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BondiWay - Seleccionar Asiento</title>
    <link rel="icon" th:href="@{/imagenes/logo.png}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <style>
        .asiento { width: 55px; height: 55px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: 0.2s;}
        .asiento:hover { transform: scale(1.05); }
        .libre { background-color: #28a745; color: white; border: 2px solid #1e7e34; box-shadow: 0 4px 6px rgba(40,167,69,0.1); }
        .ocupado { background-color: #6c757d; color: white; border: 2px solid #545b62; cursor: not-allowed; opacity: 0.7;}
        .pasillo { width: 40px; }
        .seleccionado {
            background-color: #ffc107 !important;
            border-color: #d39e00 !important;
            color: #000 !important;
            box-shadow: 0 0 12px rgba(255,193,7,0.6) !important;
        }
    </style>
</head>
<body class="bg-light">
<div th:replace="componentes/nav-bar :: navbar('busqueda')"></div>

<main role="main" class="container" style="margin-top: 140px; margin-bottom: 80px; min-height: 70vh;">
    <h2 class="text-center mb-4 fw-bold">Selecciona tu(s) asiento(s)</h2>

    <p th:if="${error != null}" class="alert alert-danger text-center" th:text="${error}"></p>

    <div id="feedback" class="text-center mb-3 fw-bold text-primary" style="min-height: 24px; font-size: 1.1rem;"></div>

    <div class="d-flex justify-content-center mt-3">
        <div class="bg-white p-4 shadow border" style="width: fit-content; border-radius: 16px;">
            <div class="text-center mb-4 pb-2 border-bottom text-muted fw-bold">FRENTE DEL VEHiCULO (CHOFER)</div>
            <div class="d-flex mb-3">
                <div class="asiento ocupado me-2">1</div>
                <div class="asiento libre me-2" data-asiento="2">2</div>
                <div class="pasillo"></div>
                <div class="asiento libre me-2" data-asiento="3">3</div>
                <div class="asiento ocupado">4</div>
            </div>
            <div class="d-flex mb-3">
                <div class="asiento libre me-2" data-asiento="5">5</div>
                <div class="asiento libre me-2" data-asiento="6">6</div>
                <div class="pasillo"></div>
                <div class="asiento ocupado me-2">7</div>
                <div class="asiento libre" data-asiento="8">8</div>
            </div>
            <div class="d-flex">
                <div class="asiento libre me-2" data-asiento="9">9</div>
                <div class="asiento ocupado me-2">10</div>
                <div class="pasillo"></div>
                <div class="asiento libre me-2" data-asiento="11">11</div>
                <div class="asiento libre" data-asiento="12">12</div>
            </div>
        </div>
    </div>

    <div class="text-center mt-5 mb-5">
        <p class="text-muted">Hace clic en los asientos verdes para seleccionarlos.</p>

        <form th:action="@{/confirmar-asiento}" method="post" id="form-confirmar">
            <input type="hidden" name="idViaje" th:value="${idViaje}" />
            <input type="hidden" name="pasajeros" th:value="${pasajeros}" />
            <input type="hidden" name="asientosSeleccionados" id="input-asientos" value="" />

            <button type="submit" class="btn text-white btn-lg px-5 mt-2 shadow"
                    style="background-color: var(--primary, #4f378a); border-radius: 12px; transition: 0.3s; font-weight: 600; padding: 16px 32px; border: none;"
                    onmouseover="this.style.filter='brightness(1.15)';"
                    onmouseout="this.style.filter='brightness(1.0)';"
                    onmousedown="this.style.transform='scale(0.98)';">
                Confirmar Asiento y Solicitar Viaje
            </button>
        </form>
    </div>
</main>

<script th:inline="javascript">

    const maxPasajeros = [[${pasajeros}]] || 1;
    let asientosSeleccionados = [];

    const feedback = document.getElementById('feedback');
    const inputAsientos = document.getElementById('input-asientos');

    feedback.innerText = "Deberás seleccionar " + maxPasajeros + " asiento(s).";

    document.querySelectorAll('.asiento.libre').forEach(asiento => {
        asiento.addEventListener('click', function() {
            const numero = this.getAttribute('data-asiento');

            if (this.classList.contains('seleccionado')) {
                this.classList.remove('seleccionado');
                asientosSeleccionados = asientosSeleccionados.filter(asiento => asiento !== numero);
            } else {

                if (asientosSeleccionados.length < maxPasajeros) {
                    this.classList.add('seleccionado');
                    asientosSeleccionados.push(numero);
                } else {
                    alert("Solo puedes seleccionar " + maxPasajeros + " asiento(s) porque fue la cantidad de pasajeros que buscaste.");
                }
            }

            inputAsientos.value = asientosSeleccionados.join(',');

            if (asientosSeleccionados.length > 0) {
                feedback.innerText = "Has seleccionado los asientos: " + asientosSeleccionados.join(', ');
            } else {
                feedback.innerText = "Deberas seleccionar " + maxPasajeros + " asiento(s).";
            }
        });
    });

    document.getElementById('form-confirmar').addEventListener('submit', function(e) {
        if(asientosSeleccionados.length !== maxPasajeros) {
            e.preventDefault();
            alert("Debes seleccionar exactamente " + maxPasajeros + " asiento(s) antes de confirmar.");
        }
    });
</script>

<div th:replace="componentes/footer :: footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
