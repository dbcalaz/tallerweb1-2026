<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Viajes Disponibles - BondiWay</title>

    <link rel="icon" th:href="@{/imagenes/logo.png}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body style="background-color: var(--background);">
<div th:replace="componentes/nav-bar :: navbar('busqueda')"></div>

<main class="home-page" style="margin-top: 60px; min-height: 70vh; padding-bottom: 40px;">

    <div class="section-header" style="margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px;">
        <div>
            <h2>Viajes Disponibles</h2>
            <p style="font-size: 18px; color: var(--text-secondary); margin-top: 8px;">
                Resultados encontrados para tu ruta de <strong th:text="${origen}"></strong> a <strong th:text="${destino}"></strong>.
            </p>
        </div>
    </div>

    <div class="trips-grid">
        <article class="trip-card" th:each="viaje : ${viajes}">
            <div class="trip-top">
                <div>
                    <span class="trip-date" th:text="'HOY, ' + ${viaje.horario}"></span>
                    <h3 th:text="${viaje.origen} + ' → ' + ${viaje.destino}"></h3>
                </div>
                <span class="seats-tag" th:text="${viaje.asientosDisponibles} + ' Asientos libres'"></span>
            </div>

            <div class="trip-info">
                <div class="trip-info-item">
                    <span class="material-symbols-outlined">schedule</span>
                    <p>Duración aprox: 45 min</p>
                </div>
                <div class="trip-info-item">
                    <span class="material-symbols-outlined">directions_bus</span>
                    <p>Servicio: Combi Express</p>
                </div>
            </div>

            <div class="trip-footer">
                <div>
                    <span class="price-label">Precio</span>
                    <h4 th:text="'$' + ${viaje.precio}" style="font-size: 24px;"></h4>
                </div>
                <a th:href="@{/seleccionar-asiento}" class="btn-primary text-center"
                   style="text-decoration: none;
                    display: inline-block;
                    border-radius: 12px;
                    font-weight: 700;
                    font-size: 14px;
                    background-color: var(--primary, #4f378a);
                    color: #ffffff;
                    transition: 0.3s;
                    border: none;"
                   onmouseover="this.style.filter='brightness(1.15)';"
                   onmouseout="this.style.filter='brightness(1.0)';"
                   onmousedown="this.style.transform='scale(0.95)';">
                    Elegir Asiento
                </a>
            </div>
        </article>
    </div>
</main>

<div th:replace="componentes/footer :: footer"></div>
</body>
</html>
