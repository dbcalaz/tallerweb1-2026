<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BondiWay - Buscar Viajes</title>

    <link rel="icon" th:href="@{/imagenes/logo.png}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/solicitar-viaje.css}">
</head>
<body style="background-color: var(--background);">
<div th:replace="componentes/nav-bar :: navbar('busqueda')"></div>

<main class="create-trip-page" style="padding-bottom: 120px;">
    <section class="page-header" style="text-align: center;">
        <h1>Buscar Viajes Disponibles</h1>
        <p>Encuentra trayectos inteligentes activos y compartidos.</p>
    </section>

    <section class="create-trip-layout" style="display: flex; justify-content: center;">
        <article class="trip-form-card" style="width: 100%; max-width: 650px; padding: 28px; background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); height: auto !important; min-height: auto !important; max-height: none !important;">
            <form th:action="@{/procesar-busqueda}" method="POST" th:object="${datosBusqueda}" class="trip-form">

                <div class="form-row two-columns-layout">
                    <div class="form-group">
                        <label>ORIGEN</label>
                        <div class="field-wrapper">
                            <span class="material-symbols-outlined">location_on</span>
                            <input id="origenTexto" type="text" list="listaParadas" placeholder="¿Desde dónde sales?" autocomplete="off" required>
                            <input type="hidden" th:field="*{idOrigen}" id="idOrigenOculto">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>DESTINO</label>
                        <div class="field-wrapper">
                            <span class="material-symbols-outlined">near_me</span>
                            <input id="destinoTexto" type="text" list="listaParadas" placeholder="¿A dónde vas?" autocomplete="off" required>
                            <input type="hidden" th:field="*{idDestino}" id="idDestinoOculto">
                        </div>
                    </div>
                </div>

                <datalist id="listaParadas">
                    <option th:each="parada : ${paradas}" th:value="${parada.nombre}" th:data-id="${parada.id}"></option>
                </datalist>

                <div class="form-row two-columns-layout">
                    <div class="form-group">
                        <label>FECHA DEL VIAJE</label>
                        <div class="field-wrapper">
                            <span class="material-symbols-outlined">calendar_today</span>
                            <input th:field="*{fecha}" id="fecha" type="date" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>PASAJEROS</label>
                        <div class="field-wrapper">
                            <span class="material-symbols-outlined">group</span>
                            <select th:field="*{pasajeros}" style="width:100%; border:none; background:transparent; font-family: inherit; font-size: inherit; cursor: pointer;">
                                <option value="1">1 Pasajero</option>
                                <option value="2">2 Pasajeros</option>
                                <option value="3">3 Pasajeros</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn-primary create-btn" style="width: 100%; justify-content: center;">Buscar Viajes</button>
                </div>

                <p th:if="${error != null}" style="color: red; margin-top: 15px; font-weight: 600;" th:text="${error}"></p>
            </form>
        </article>
    </section>
</main>

<div style="position: fixed; bottom: 0; left: 0; width: 100%; z-index: 1000;">
    <div th:replace="componentes/footer :: footer"></div>
</div>

<script>
    /* eslint-disable indent, quotes */
    document.addEventListener("DOMContentLoaded", function() {
        function enlazar(visibleId, ocultoId) {
            const inputVisible = document.getElementById(visibleId);
            const inputOculto = document.getElementById(ocultoId);
            const opciones = document.getElementById("listaParadas").options;

            inputVisible.addEventListener("input", function() {
                inputOculto.value = "";
                for (let i = 0; i < opciones.length; i++) {
                    if (opciones[i].value === inputVisible.value) {
                        inputOculto.value = opciones[i].getAttribute("data-id");
                        break;
                    }
                }
            });
        }
        enlazar("origenTexto", "idOrigenOculto");
        enlazar("destinoTexto", "idDestinoOculto");

        const hoy = new Date();
        let mes = hoy.getMonth() + 1;
        let dia = hoy.getDate();
        if (mes < 10) mes = "0" + mes;
        if (dia < 10) dia = "0" + dia;
        document.getElementById("fecha").setAttribute("min", hoy.getFullYear() + "-" + mes + "-" + dia);
    });
</script>
</body>
</html>
