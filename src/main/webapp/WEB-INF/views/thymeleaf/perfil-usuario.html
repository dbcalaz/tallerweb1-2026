<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BondiWay - Inicio</title>

    <link rel="icon" th:href="@{/imagenes/logo.png}" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>
<body>
<div th:replace="componentes/nav-bar :: navbar('home')"></div>
<main class="page-container">

    <section class="hero-section">
        <div class="hero-content">
            <div class="hero-image-continer">
                <img src="" alt="Perfil de usuario" class="hero-image">
            </div>
            <div class="hero-text">
                <h1  th:text="${usuario.nombre}"></h1>
                <h2  th:text="${usuario.apellido}"></h2>
                <h2 th:text="${usuario.email}"></h2>
                <div class="cta-buttons">
                    <button class="btn-primary">
                        Editar Perfil
                    </button>
                    <button class="btn-secundary">
                        Configuracion
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Estadisticas -->

    <section class="features-grid">
        <div class="feature-card">
            <h3 class="feature-title">
                Viajes Realizados
            </h3>
            <p class="feature-description">
                124
            </p>
        </div>

        <div class="feature-card">
            <h3 class="feature-title">
                Viajes Cancelados
            </h3>
            <p class="feature-description" style="color:var(--error);">
                2
            </p>
        </div>

        <div class="feature-card">
            <h3 class="feature-title">
                Puntuacion
            </h3>
            <p class="feature-description">
                4.9
            </p>
        </div>

        <div class="feature-card">
            <h3 class="feature-title">
                Conductor Favorito
            </h3>
            <p class="feature-description">
                Luis G.
            </p>
        </div>

    </section>

    <!--HISTORIAL-->

    <h1>Historial</h1>
    <h2 th:text="${#lists.size(reservas)}"></h2>

    <div class="feature-card"
         th:each="reserva : ${reservas}">

        <p th:text="${reserva.estadoReserva}"></p>

        <h3 th:text="${reserva.viaje.origen}"></h3>

        <h3 th:text="${reserva.viaje.destino}"></h3>

        <h2 th:text="${'$' + reserva.viaje.precio}"></h2>

    </div>
    <h2>Fin historial</h2>





</main>
<div th:replace="componentes/footer :: footer"></div>
</body>
</html>
